# ClusterIP: stable IP + DNS name "web", reachable only inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  selector:
    app: web # traffic goes to pods with this label
  ports:
    - port: 80
      targetPort: 80
---
# NodePort: opens port 30090 on every node (kind maps it to localhost:30090)
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
